journal(){const gs=DB.grades.filter(own).slice().reverse();return`<h1>${nm("journal")}</h1>${can("grade")?`<div class="card"><div class="f"><select id="a">${opts(stus())}</select><select id="b">${opts(subs())}</select><input id="c" type="number" min="0" max="100" placeholder="${t("pts")}"><button class="btn" onclick="API.addGrade(val('a'),val('b'),val('c'))">${t("add")}</button></div></div>`:""}<div class="card">${T([t("sb"),me.role!="student"?t("st"):t("dt"),t("pts"),t("by"),t("dt")],gs.map(g=>[sn(g.sub),me.role!="student"?E(un(g.s)):g.at,`<span class="tag ok">${g.p}</span>`,E(un(g.by)),g.at]))}</div>`},
password(){return`<h1>${nm("password")}</h1><div class="card" style="max-width:420px"><div class="f"><input id="a" type="password" placeholder="${t("old")}"><input id="b" type="password" placeholder="${t("nw")}"></div><br><button class="btn" onclick="API.chPw(val('a'),val('b'))">${t("ok")}</button></div>`},
help(){return`<h1>${nm("help")}</h1><div class="card"><h2>AI XPres</h2><p>${t("a1")}</p></div><div class="card"><details><summary>${t("f1")}</summary><p>${t("f2")}</p></details><details><summary>${t("f3")}</summary><p>${t("f4")}</p></details></div>`},
admin(){return`<h1>${nm("admin")}</h1><div class="card"><div class="f"><input id="a" placeholder="${t("nm")}"><input id="b" placeholder="${t("lg")}"><input id="c" placeholder="${t("pw")}"><select id="d"><option value="student">${RL.student[li]}</option><option value="teacher">${RL.teacher[li]}</option>${can("role")?`<option value="admin">${RL.admin[li]}</option>`:""}</select><button class="btn" onclick="API.addUser(val('a'),val('b'),val('c'),val('d'))">${t("add")}</button></div></div><div class="card">${T([t("nm"),t("lg"),t("ro"),""],DB.users.map(u=>[E(u.name),E(u.login),RL[u.role][li],u.id==me.id?"":`<button class="btn r" onclick="ask(()=>API.delUser('${u.id}'))">${t("del")}</button>`]))}</div>`}};
